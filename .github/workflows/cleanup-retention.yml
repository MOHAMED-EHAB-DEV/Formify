name: Formify Storage Retention & Cleanup

on:
  schedule:
    # Runs on the 1st day of every month at 03:00 UTC
    - cron: '0 3 1 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  cleanup:
    name: Purge Expired Responses & Dormant Forms
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run retention cleanup script
        run: bun run scripts/cleanup-old-responses.ts
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          UPLOADTHING_TOKEN: ${{ secrets.UPLOADTHING_TOKEN }}
